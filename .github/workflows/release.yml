name: Release

# Publishes to npm when a version tag is pushed, e.g. `git push origin v1.3.0`.
# A tag with a prerelease segment (e.g. v2.0.0-exp.0) publishes under the
# `next` dist-tag so it never overwrites `latest`.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm provenance
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Node CJS/ESM smoke tests
        run: npm run test:node

      - name: Publish to npm
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "Prerelease ${GITHUB_REF_NAME} -> dist-tag 'next'"
            npm publish --access public --tag next --provenance
          else
            echo "Stable ${GITHUB_REF_NAME} -> dist-tag 'latest'"
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
